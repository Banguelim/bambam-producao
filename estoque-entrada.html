<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>Entrada no Estoque · BAMBAM PRODUÇÃO</title>
<link rel="stylesheet" href="base.css">
<style>
  /* ====== Cabeçalho da página ====== */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#fff;border-bottom:1px solid #e5e7eb}
  .topbar h1{font-size:18px;margin:0;font-weight:600;color:#111}
  .topbar .voltar{color:#2563eb;text-decoration:none;font-weight:600}

  /* ====== TELA 1 · lista de lotes aguardando estoque ====== */
  .painel-lotes{padding:16px}
  .painel-lotes h2{font-size:15px;color:#374151;margin:0 0 10px 0;font-weight:600}
  .chip-lote{
    display:inline-flex;align-items:center;gap:6px;
    background:#fff;border:1px solid #d1d5db;border-radius:999px;
    padding:6px 12px;margin:4px;font-size:13px;font-weight:600;color:#111;
    cursor:pointer;transition:.15s
  }
  .chip-lote:hover{border-color:#16a34a;background:#f0fdf4}
  .chip-lote .bolinha{width:8px;height:8px;border-radius:50%;background:#f59e0b}
  .chip-lote .qtd{color:#6b7280;font-weight:500;margin-left:4px}
  .vazio{color:#6b7280;font-style:italic;padding:20px}

  /* ====== TELA 2 · painel de entrada no estoque ====== */
  .painel-entrada{display:none;padding:12px 16px}
  .cab-painel{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:10px 14px;margin-bottom:10px}
  .cab-painel .campo{display:flex;flex-direction:column;gap:2px}
  .cab-painel label{font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.3px;font-weight:600}
  .cab-painel input[type=date]{border:1px solid #d1d5db;border-radius:6px;padding:6px 8px;font-size:14px}
  .cab-painel .info-lote{font-size:16px;font-weight:700;color:#111}
  .cab-painel .info-ref{font-size:13px;color:#6b7280;margin-top:2px}
  .cab-painel .aguard-total{margin-left:auto;text-align:right;font-size:13px;color:#374151}
  .cab-painel .aguard-total b{font-size:20px;color:#f59e0b;display:block}

  .grade-tam{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .col-tam{
    background:#fff;border:1px solid #e5e7eb;border-radius:8px;
    display:flex;flex-direction:column;overflow:hidden;min-height:400px
  }
  .col-tam .cab{
    background:#f3f4f6;padding:8px;text-align:center;font-size:15px;font-weight:700;
    color:#111;border-bottom:1px solid #e5e7eb;position:relative
  }
  .col-tam .check-all{position:absolute;left:6px;top:8px}
  .col-tam .lista{flex:1;padding:6px;display:flex;flex-direction:column;gap:4px}
  .item-cor{
    display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;
    background:#f9fafb;border:1px solid #f3f4f6;transition:.15s
  }
  .item-cor.marcado{background:#dcfce7;border-color:#86efac}
  .item-cor.esgotado{opacity:.35;background:#f9fafb}
  .item-cor input[type=checkbox]{width:16px;height:16px;cursor:pointer}
  .item-cor .cor{flex:1;font-size:12px;font-weight:600;color:#111;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item-cor .qtd{
    font-size:14px;font-weight:800;color:#111;
    min-width:40px;text-align:right;
    background:transparent;border:none;padding:2px 4px;outline:none
  }
  .item-cor .qtd:focus{background:#fff;border:1px solid #16a34a;border-radius:4px}
  .item-cor .max{font-size:10px;color:#6b7280;margin-left:2px}

  .col-tam .rodape{
    background:#fafafa;padding:6px 8px;border-top:1px solid #e5e7eb;
    font-size:11px;color:#6b7280;line-height:1.6
  }
  .col-tam .rodape .linha{display:flex;justify-content:space-between}
  .col-tam .rodape .num-aguard{color:#f59e0b;font-weight:700}
  .col-tam .rodape .num-entra{color:#16a34a;font-weight:700}
  .col-tam .rodape .num-resta{color:#111;font-weight:700}

  /* ====== Rodapé geral ====== */
  .rodape-geral{
    display:flex;align-items:center;gap:14px;
    background:#fff;border:1px solid #e5e7eb;border-radius:8px;
    padding:12px 16px;margin-top:12px
  }
  .rodape-geral .totais{flex:1;font-size:13px;color:#374151}
  .rodape-geral .totais b{color:#16a34a;font-size:18px}
  .btn{padding:10px 18px;border-radius:6px;font-weight:700;font-size:14px;cursor:pointer;border:none;transition:.15s}
  .btn-cancelar{background:#f3f4f6;color:#374151}
  .btn-cancelar:hover{background:#e5e7eb}
  .btn-confirmar{background:#16a34a;color:#fff}
  .btn-confirmar:hover:not(:disabled){background:#15803d}
  .btn-confirmar:disabled{background:#9ca3af;cursor:not-allowed}

  /* Loading */
  .loading{text-align:center;padding:40px;color:#6b7280}
</style>
</head>
<body>

<header class="topbar">
  <h1>📦 Entrada no Estoque</h1>
  <a href="index.html" class="voltar">← Menu</a>
</header>

<!-- TELA 1: lista de lotes aguardando -->
<section class="painel-lotes" id="tela-lotes">
  <h2>Lotes aguardando entrada no estoque</h2>
  <div id="lista-lotes" class="loading">Carregando...</div>
</section>

<!-- TELA 2: painel de entrada -->
<section class="painel-entrada" id="tela-painel">
  <div class="cab-painel">
    <div class="campo">
      <label>Data</label>
      <input type="date" id="data-entrada">
    </div>
    <div class="campo">
      <label>Lote / Ref</label>
      <div>
        <span class="info-lote" id="info-lote">—</span>
        <div class="info-ref" id="info-ref">—</div>
      </div>
    </div>
    <div class="aguard-total">
      Aguardando arremate:
      <b id="total-aguardando">0</b>
      peças
    </div>
  </div>

  <div class="grade-tam" id="grade"></div>

  <div class="rodape-geral">
    <div class="totais">
      Vai entrar no estoque:
      <b id="total-entra">0</b>
      peças de <span id="total-refs">0</span> cores
    </div>
    <button class="btn btn-cancelar" onclick="voltarLista()">Cancelar</button>
    <button class="btn btn-confirmar" id="btn-confirmar" onclick="confirmarEntrada()" disabled>
      ✓ Confirmar entrada no estoque
    </button>
  </div>
</section>

<!-- Firebase compat SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="entrada-estoque.js"></script>
</body>
</html>

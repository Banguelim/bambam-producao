<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAMBAM · Estoque</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/forms.css">
<style>
  .barra-busca { display: flex; gap: 10px; align-items: center; padding: 10px 14px; background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .barra-busca .campo-busca { flex: 1; min-width: 180px; position: relative; }
  .barra-busca input { width: 100%; padding: 10px 12px 10px 34px; font-size: 15px; font-weight: 700; text-transform: uppercase; border-radius: 6px; border: 0.5px solid var(--border); background: var(--surface-1); color: var(--text-primary); min-height: 40px; font-family: 'Courier New', ui-monospace, monospace; letter-spacing: 0.5px; }
  .barra-busca .lupa { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; pointer-events: none; }
  .barra-busca button { padding: 10px 18px; font-size: 13px; font-weight: 700; border-radius: 6px; border: none; cursor: pointer; background: var(--bg-accent-strong); color: white; min-height: 40px; }
  .barra-busca button:hover { filter: brightness(1.15); }
  .barra-busca .info { color: var(--text-muted); font-size: 12px; white-space: nowrap; }
  .card-ref { background: var(--surface-1); border: 0.5px solid var(--border); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
  .card-ref-header { display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: var(--surface-2); border-bottom: 0.5px solid var(--border); }
  .card-ref-header .ref-num { font-family: 'Courier New', ui-monospace, monospace; font-size: 20px; font-weight: 900; color: var(--text-primary); letter-spacing: 1px; }
  .card-ref-header .ref-num .rot { font-size: 10px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-right: 6px; }
  .card-ref-header .badge-total { margin-left: auto; padding: 4px 12px; background: var(--bg-accent-strong); color: white; border-radius: 20px; font-size: 12px; font-weight: 700; }
  .card-ref-header .contador-cores { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  .grade-cores { padding: 8px 16px 12px; }
  .grade-header-cores, .cor-linha { display: grid; grid-template-columns: 120px repeat(5, 1fr) 110px; gap: 4px; align-items: center; padding: 6px 4px; }
  .grade-header-cores { border-bottom: 1.5px solid var(--border-accent); padding: 10px 4px 12px; margin-bottom: 4px; background: color-mix(in srgb, var(--bg-accent) 6%, transparent); border-radius: 4px; }
  .grade-header-cores .h-cor { text-align: left; padding-left: 4px; font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; align-self: center; }
  .grade-header-cores .h-tam { text-align: center; font-family: 'Courier New', ui-monospace, monospace; display: flex; align-items: baseline; justify-content: center; gap: 6px; }
  .grade-header-cores .h-tam .tam-rot { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; font-family: inherit; }
  .grade-header-cores .h-tam b { font-size: 20px; font-weight: 900; color: var(--text-accent); font-variant-numeric: tabular-nums; }
  .grade-header-cores .h-tot { text-align: right; font-family: 'Courier New', ui-monospace, monospace; color: var(--text-muted); font-size: 12px; align-self: center; }
  .grade-header-cores .h-tot b { font-size: 20px; font-weight: 900; color: var(--success); font-variant-numeric: tabular-nums; margin-left: 2px; }
  .cor-linha { border-bottom: 0.5px dashed color-mix(in srgb, var(--border) 60%, transparent); font-family: 'Courier New', ui-monospace, monospace; }
  .cor-linha:last-child { border-bottom: none; }
  .cor-linha:hover { background: color-mix(in srgb, var(--bg-accent) 8%, transparent); }
  .cor-linha .cor-nome { font-weight: 700; font-size: 14px; color: var(--text-primary); letter-spacing: 0.5px; padding-left: 4px; }
  .cor-linha .qtd { text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text-primary); font-size: 15px; }
  .cor-linha .qtd.zero { color: var(--text-muted); font-weight: 400; }
  .cor-linha .total-linha { text-align: right; font-weight: 800; color: var(--success); font-size: 15px; font-variant-numeric: tabular-nums; }
  .msg { background: var(--surface-1); border: 0.5px dashed var(--border); color: var(--text-muted); padding: 40px 20px; text-align: center; border-radius: 10px; font-size: 14px; }
  .msg.err { color: var(--text-danger); border-color: var(--text-danger); }
  .msg .icone { font-size: 32px; margin-bottom: 8px; }
  @media (max-width: 640px) {
    .grade-header-cores, .cor-linha { grid-template-columns: 85px repeat(5, 1fr) 70px; gap: 2px; }
    .cor-linha .cor-nome, .cor-linha .qtd, .cor-linha .total-linha { font-size: 12px; }
    .grade-header-cores .h-tam b, .grade-header-cores .h-tot b { font-size: 15px; }
    .grade-header-cores .h-tam .tam-rot { font-size: 9px; }
    .card-ref-header .ref-num { font-size: 16px; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <span class="logo">BAMBAM <b>BABY</b></span>
    <nav class="nav">
      <a href="index.html">Painel</a>
      <a href="novo-corte.html">Novo corte</a>
      <a href="designacao.html">Designação</a>
      <a href="retorno.html">Retorno</a>
      <a href="pagamento.html">Pagamento</a>
      <a href="arremate.html">Arremate</a>
      <a href="estoque.html" class="ativo">Estoque</a>
      <a href="cadastros.html">Cadastros</a>
      <a href="relatorios.html">Relatórios</a>
      <a href="pedido.html">Pedidos</a>
      <a href="pedido-novo.html">Pedido Novo</a>
      <a href="vendas-cadastros.html">Clientes</a>
      <a href="contas-receber.html">Financeiro</a>
    </nav>
    <div class="user">
      <span id="user-email">—</span>
      <button class="logout" onclick="logout()">sair</button>
    </div>
  </div>

  <datalist id="refs-list"></datalist>

  <div class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">
      <h1 style="margin:0">Estoque</h1>
      <span class="hint" id="info-topo">Digite uma referência pra consultar</span>
    </div>

    <div class="barra-busca">
      <div class="campo-busca">
        <span class="lupa">🔎</span>
        <input list="refs-list" id="ref-input" placeholder="digite a referência (ex: 104)" autocomplete="off">
      </div>
      <button id="btn-buscar">Buscar</button>
      <span class="info" id="info-bar">carregando refs...</span>
    </div>

    <div id="vazio" class="msg">
      <div class="icone">📦</div>
      Digite uma referência acima pra ver o estoque dela.
    </div>

    <div id="nao-encontrado" class="msg err" style="display:none">
      Nenhum estoque encontrado pra essa REF.
    </div>

    <div id="resultado"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/acesso.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/estoque.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAMBAM · Pedidos</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/forms.css">
<style>
  .bloco-lista { background: var(--surface-1); border: 0.5px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  .bloco-lista h3 { margin-bottom: 10px; }
  .vazio-itens { padding: 24px; text-align: center; color: var(--text-muted); font-size: 13px; background: var(--surface-2); border-radius: 8px; }
  .item-pedido { display: flex; align-items: center; gap: 12px; padding: 9px 12px; background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 6px; margin-bottom: 6px; cursor: pointer; font-size: 13px; }
  .item-pedido:hover { border-color: var(--border-accent); }
  .item-pedido .num { font-weight: 800; color: var(--text-accent); min-width: 50px; }
  .item-pedido .cli { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-pedido .val { font-weight: 700; color: var(--success); }
</style>
</head>
<body>
  <div class="topbar">
    <span class="logo">BAMBAM <b>BABY</b></span>
    <nav class="nav">
      <a href="index.html">Painel</a>
      <a href="novo-corte.html">Novo corte</a>
      <a href="designacao.html">Designação</a>
      <a href="retorno.html">Retorno</a>
      <a href="pagamento.html">Pagamento</a>
      <a href="arremate.html">Arremate</a>
      <a href="estoque.html">Estoque</a>
      <a href="cadastros.html">Cadastros</a>
      <a href="relatorios.html">Relatórios</a>
      <a href="pedido.html" class="ativo">Pedidos</a>
      <a href="pedido-novo.html">Pedido Novo</a>
      <a href="vendas-cadastros.html">Clientes</a>
      <a href="contas-receber.html">Financeiro</a>
    </nav>
    <div class="user">
      <span id="user-email">—</span>
      <button class="logout" onclick="logout()">sair</button>
    </div>
  </div>

  <div class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px">
      <h1 style="margin:0">Pedidos</h1>
      <a class="btn btn-primary" href="pedido-novo.html">+ novo pedido</a>
    </div>

    <div class="bloco-lista">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:12px;flex-wrap:wrap">
        <h3 style="margin:0">Pedidos em aberto <span id="lbl-pedidos-abertos-total" style="color:var(--text-muted);font-weight:500;font-size:13px"></span></h3>
        <input id="busca-pedido-aberto" placeholder="🔎 buscar por cliente ou nº do pedido" style="min-width:260px;padding:8px 12px">
      </div>
      <div id="lista-pedidos-abertos"><div class="vazio-itens">Carregando...</div></div>
    </div>

    <div class="bloco-lista">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:12px;flex-wrap:wrap">
        <h3 style="margin:0">Pedidos concluídos <span id="lbl-pedidos-concluidos-total" style="color:var(--text-muted);font-weight:500;font-size:13px"></span></h3>
        <input id="busca-pedido-concluido" placeholder="🔎 buscar por cliente ou nº do pedido" style="min-width:260px;padding:8px 12px">
      </div>
      <div id="lista-pedidos-concluidos"><div class="vazio-itens">Carregando...</div></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/acesso.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/db-vendas.js"></script>
  <script src="js/pedidos.js"></script>
</body>
</html>
